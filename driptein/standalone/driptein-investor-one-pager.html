  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bf70deee-e787-4e2f-b03b-c5ae31b4a6e2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7e5438d3-7b2a-468b-b24f-d95fef175bac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DRIPTEIN — Shared Brand System\n   Palette: \"Syrup Pour\" (Direction A)  ·  Type: Anton / Archivo / Space Mono (Direction B)\n   Used across: hub, VC deck, PE deck, F&B deck, one-pager\n   ============================================================ */\n\n:root{\n  /* --- core palette --- */\n  --ink:        #241310;   /* espresso — primary dark */\n  --ink-2:      #341c12;   /* raised brown (cards / gradient stop) */\n  --ink-3:      #46271a;   /* lighter brown */\n  --cream:      #F4E8D2;   /* primary light / paper */\n  --cream-2:    #EADDC2;   /* deeper cream (panels on cream) */\n  --syrup:      #C9772E;   /* PRIMARY accent — syrup amber */\n  --syrup-lt:   #E0913F;   /* accent for on-dark text/lines */\n  --cinnamon:   #A23A1C;   /* SECONDARY accent — cinnamon rust */\n  --oat:        #93826C;   /* warm neutral */\n  --oat-lt:     #B6A78F;\n\n  /* --- semantic --- */\n  --line-on-ink:   rgba(244,232,210,.16);\n  --line-on-cream: rgba(36,19,16,.14);\n  --muted-on-ink:  #c9b9a3;\n  --muted-on-cream:#6f5b48;\n\n  /* --- type families --- */\n  --font-display: 'Anton', 'Archivo', sans-serif;\n  --font-body:    'Archivo', sans-serif;\n  --font-mono:    'Space Mono', ui-monospace, monospace;\n\n  /* --- deck type scale (1920×1080) --- */\n  --t-hero:    158px;  /* giant stat numerals */\n  --t-display: 116px;  /* cover headline */\n  --t-title:   80px;   /* slide titles */\n  --t-subtitle:46px;\n  --t-lead:    38px;\n  --t-body:    29px;\n  --t-small:   25px;\n  --t-mono:    24px;   /* eyebrows / labels (deck floor = 24) */\n\n  /* --- deck spacing --- */\n  --pad-x:      120px;\n  --pad-top:    96px;\n  --pad-bottom: 84px;\n  --gap-title:  44px;\n  --gap-item:   26px;\n}\n\n/* ===================== DECK FRAME ===================== */\ndeck-stage:not(:defined){visibility:hidden}\ndeck-stage{background:#100a07;}\n\n.s{\n  box-sizing:border-box;\n  padding:var(--pad-top) var(--pad-x) var(--pad-bottom);\n  display:flex; flex-direction:column;\n  font-family:var(--font-body);\n  background:var(--cream); color:var(--ink);\n  overflow:hidden; position:relative;\n}\n.bg-ink{background:var(--ink); color:var(--cream);}\n.bg-ink2{background:radial-gradient(120% 130% at 18% 0%, #43261a 0%, var(--ink) 58%); color:var(--cream);}\n.bg-cream{background:var(--cream); color:var(--ink);}\n.bg-syrup{background:var(--syrup); color:#2a1608;}\n.bg-cinnamon{background:var(--cinnamon); color:#fbe9df;}\n\n/* reset UA margins inside slides — inline/class margins still win (:where = 0 specificity) */\n.s :where(h1,h2,h3,h4,h5,p,ul,ol,figure){margin:0;}\n\n/* ===================== TYPE ===================== */\n.eyebrow{\n  font-family:var(--font-mono); font-size:var(--t-mono);\n  letter-spacing:.30em; text-transform:uppercase; color:var(--syrup);\n  font-weight:700;\n}\n.bg-ink .eyebrow,.bg-ink2 .eyebrow{color:var(--syrup-lt);}\n.bg-syrup .eyebrow{color:#5a2f10;}\n.bg-cinnamon .eyebrow{color:#f4c9b4;}\n\n.title{\n  font-family:var(--font-display); font-weight:400;\n  font-size:var(--t-title); line-height:.94; text-transform:uppercase;\n  letter-spacing:.005em; text-wrap:balance;\n}\n.display{\n  font-family:var(--font-display); font-weight:400;\n  font-size:var(--t-display); line-height:.9; text-transform:uppercase;\n  letter-spacing:.004em;\n}\n.subtitle{font-family:var(--font-display);font-weight:400;font-size:var(--t-subtitle);text-transform:uppercase;line-height:1;}\n.lead{font-size:var(--t-lead); line-height:1.34; font-weight:400; color:var(--muted-on-cream); text-wrap:pretty;}\n.bg-ink .lead,.bg-ink2 .lead{color:var(--muted-on-ink);}\n.body{font-size:var(--t-body); line-height:1.46; font-weight:400; text-wrap:pretty;}\n.small{font-size:var(--t-small); line-height:1.4;}\n.mono{font-family:var(--font-mono); font-size:var(--t-mono); letter-spacing:.04em;}\n.accent{color:var(--syrup);}\n.bg-ink .accent,.bg-ink2 .accent{color:var(--syrup-lt);}\n.num{font-family:var(--font-display);font-weight:400;font-size:var(--t-hero);line-height:.82;letter-spacing:.005em;}\n\n/* ===================== STRUCTURE HELPERS ===================== */\n.topbar{display:flex;align-items:center;justify-content:space-between;}\n.spread{flex:1;display:flex;flex-direction:column;justify-content:center;}\n.row{display:flex;}\n.col{display:flex;flex-direction:column;}\n.between{justify-content:space-between;}\n.center{align-items:center;}\n.mt-auto{margin-top:auto;}\n.gap-title{gap:var(--gap-title);}\n.gap-item{gap:var(--gap-item);}\n\n.rule{height:2px;background:var(--line-on-cream);border:0;width:100%;}\n.bg-ink .rule,.bg-ink2 .rule{background:var(--line-on-ink);}\n\n.mark{height:54px;width:auto;opacity:.95;}\n.section-num{font-family:var(--font-mono);font-size:var(--t-mono);letter-spacing:.2em;opacity:.7;}\n\n/* chips */\n.chip{\n  font-family:var(--font-mono);font-size:21px;letter-spacing:.12em;text-transform:uppercase;\n  padding:10px 18px;border:1.5px solid var(--line-on-cream);border-radius:999px;white-space:nowrap;\n}\n.bg-ink .chip,.bg-ink2 .chip{border-color:var(--line-on-ink);}\n.chip.solid{background:var(--syrup);border-color:var(--syrup);color:#2a1608;}\n\n/* stat blocks */\n.stat .k{font-family:var(--font-mono);font-size:23px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-on-cream);margin-top:14px;}\n.bg-ink .stat .k,.bg-ink2 .stat .k{color:var(--muted-on-ink);}\n.bg-syrup .stat .k{color:#5a2f10;}\n\n/* data cards (kept square-cornered, no left-accent-border trope) */\n.panel{background:var(--cream-2);padding:38px 40px;}\n.bg-ink .panel,.bg-ink2 .panel{background:rgba(244,232,210,.06);}\n\n/* image placeholder slot — user drops real renders here */\n.ph{\n  position:relative;background:var(--cream-2);overflow:hidden;\n  display:flex;align-items:flex-end;\n  background-image:repeating-linear-gradient(45deg, rgba(36,19,16,.05) 0 2px, transparent 2px 16px);\n  border:1.5px dashed rgba(36,19,16,.22);\n}\n.bg-ink .ph,.bg-ink2 .ph{background:rgba(244,232,210,.04);border-color:rgba(244,232,210,.22);\n  background-image:repeating-linear-gradient(45deg, rgba(244,232,210,.05) 0 2px, transparent 2px 16px);}\n.ph .ph-tag{\n  font-family:var(--font-mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase;\n  color:var(--muted-on-cream);padding:16px 18px;background:rgba(244,232,210,.7);margin:14px;border-radius:6px;\n}\n.bg-ink .ph .ph-tag,.bg-ink2 .ph .ph-tag{color:var(--muted-on-ink);background:rgba(20,12,8,.55);}\n\n/* TBD pill — used for pre-development placeholders */\n.tbd{\n  display:inline-block;font-family:var(--font-mono);font-size:.62em;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--cinnamon);border:1.5px solid currentColor;border-radius:6px;\n  padding:.18em .5em;vertical-align:middle;line-height:1;font-weight:700;\n}\n.bg-ink .tbd,.bg-ink2 .tbd{color:var(--syrup-lt);}\n\n/* page footer (deck) */\n.pagefoot{font-family:var(--font-mono);font-size:21px;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--muted-on-cream);display:flex;justify-content:space-between;align-items:center;}\n.bg-ink .pagefoot,.bg-ink2 .pagefoot{color:var(--muted-on-ink);}\n\n/* source/footnote caption */\n.src{font-family:var(--font-mono);font-size:24px;letter-spacing:.04em;color:var(--oat);line-height:1.4;}\n\n/* ===================== BACK-LINK PILL (decks) ===================== */\n.backlink{\n  position:fixed;top:18px;right:18px;z-index:40;\n  display:flex;align-items:center;gap:10px;text-decoration:none;\n  font-family:var(--font-mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;\n  color:var(--cream);background:rgba(36,19,16,.82);backdrop-filter:blur(6px);\n  border:1px solid rgba(244,232,210,.22);border-radius:999px;padding:9px 16px 9px 12px;\n  transition:background .18s, transform .18s;\n}\n.backlink:hover{background:var(--cinnamon);transform:translateY(-1px);}\n.backlink img{height:20px;width:auto;}\n@media print{.backlink{display:none!important;}}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;background:#1c1a17;font-family:var(--font-body);}\n  /* screen toolbar (hidden in print) */\n  .toolbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(36,19,16,.94);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:50;}\n  .toolbar .bl{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);font-family:var(--font-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;}\n  .toolbar .bl img{height:20px;}\n  .toolbar .pr{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:var(--syrup);border:0;border-radius:999px;padding:9px 16px;cursor:pointer;}\n  .stage{display:flex;justify-content:center;padding:84px 20px 40px;}\n  /* US Letter sheet */\n  .sheet{width:816px;min-height:1056px;background:var(--cream);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;}\n  .pad{padding:24px 52px;}\n  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--syrup);font-weight:700;}\n  /* header band */\n  .band{background:var(--ink);color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:18px 52px;}\n  .band img{height:42px;}\n  .status{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--syrup-lt);border:1.5px solid var(--syrup-lt);border-radius:999px;padding:8px 14px;}\n  /* hook */\n  .hook{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:42px;line-height:.96;letter-spacing:.005em;margin:0;}\n  .sub{font-size:15px;line-height:1.46;color:var(--muted-on-cream);max-width:74%;margin-top:10px;}\n  /* hero stats */\n  .heroes{display:flex;gap:18px;margin-top:18px;}\n  .hero{flex:1;background:var(--ink);color:var(--cream);padding:16px 22px;display:flex;flex-direction:column;}\n  .hero.alt{background:var(--syrup);color:#2a1608;}\n  .hero .n{font-family:var(--font-display);font-size:60px;line-height:.82;}\n  .hero .k{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:10px;}\n  .bottlebadge{width:140px;display:flex;align-items:flex-end;justify-content:center;}\n  .bottlebadge img{height:116px;filter:drop-shadow(0 14px 22px rgba(36,19,16,.3));}\n  /* sections grid */\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--line-on-cream);}\n  .cell{padding:9px 0;}\n  .cell.r{padding-left:34px;border-left:2px solid var(--line-on-cream);}\n  .cell.l{padding-right:34px;}\n  .h{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-on-cream);margin-bottom:10px;}\n  .mstat{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}\n  .mstat b{font-family:var(--font-display);font-size:30px;font-weight:400;color:var(--ink);min-width:108px;}\n  .mstat.acc b{color:var(--syrup);}\n  .mstat span{font-size:13.5px;line-height:1.34;color:var(--muted-on-cream);}\n  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;}\n  .chip2{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--syrup);color:#2a1608;border-radius:999px;padding:7px 13px;}\n  .li{font-size:14px;line-height:1.4;margin-bottom:5px;display:flex;gap:10px;}\n  .li i{color:var(--syrup);font-style:normal;font-weight:800;}\n  .tbd{display:inline-block;font-family:var(--font-mono);font-size:.74em;letter-spacing:.04em;text-transform:uppercase;color:var(--cinnamon);border:1.4px solid currentColor;border-radius:5px;padding:.1em .42em;line-height:1;font-weight:700;}\n  /* ask band */\n  .askband{margin-top:auto;background:var(--ink);color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:16px 52px;}\n  .askband .big{font-family:var(--font-display);font-size:54px;line-height:.9;}\n  .askband .lab{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--syrup-lt);}\n  .askband .contact{text-align:right;font-size:13px;line-height:1.6;}\n  @page{size:letter;margin:0;}\n  @media print{\n    html,body{background:#fff;}\n    .toolbar{display:none!important;}\n    .stage{padding:0;}\n    .sheet{box-shadow:none;width:100%;min-height:100vh;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n\n<div class=\"toolbar\">\n  <a class=\"bl\" href=\"../index.html\"><img src=\"603aaa69-87d4-47a8-b9c4-dbe259d63cc3\" alt=\"\">← DRIPTEIN<\u002Fa>\n  <button class=\"pr\" onclick=\"window.print()\">Print / Save PDF<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"stage\">\n  <div class=\"sheet\">\n\n    <div class=\"band\">\n      <img src=\"88abfe77-54b4-4f01-b8ef-c0d1e8a259d8\" alt=\"DRIPTEIN\">\n      <div class=\"status\">Currently in development<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pad\" style=\"padding-bottom:14px;\">\n      <div class=\"eyebrow\">Protein you pour · Pre-Seed · A Hyperius Holdings venture<\u002Fdiv>\n      <h1 class=\"hook\" style=\"margin-top:16px;\">The first whey<br>syrup built to drip<\u00
